# Single-host staging deployment: Caddy (TLS) -> api + web, Postgres and MinIO
# private. MinIO is also served at https://s3.$APP_DOMAIN (needs its own DNS
# record) because clients upload chunks to presigned URLs directly.
# Usage: docker compose -f compose.prod.yaml --env-file .env up -d --build
# Required in .env: APP_DOMAIN, ACCESS_TOKEN_SIGNING_KEY (>=32 chars),
# POSTGRES_PASSWORD, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (MinIO root creds).
name: deeparchive

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deeparchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: deeparchive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeparchive -d deeparchive"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest # shortcut: unpinned, pin a RELEASE tag before anything long-lived
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-deeparchive}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\"
      "

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://deeparchive:${POSTGRES_PASSWORD}@postgres:5432/deeparchive?sslmode=disable
    command: ["up"]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: &app_env
      APP_ENV: production
      HTTP_ADDR: ":8080"
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://deeparchive:${POSTGRES_PASSWORD}@postgres:5432/deeparchive?sslmode=disable
      ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY:?set ACCESS_TOKEN_SIGNING_KEY}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      WEB_PUBLIC_URL: https://${APP_DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://s3.${APP_DOMAIN}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-deeparchive}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_USE_PATH_STYLE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      RETENTION_SWEEP_INTERVAL: ${RETENTION_SWEEP_INTERVAL:-1h}

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: "" # same origin: Caddy routes /api to the API
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - minio
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  minio_data:
  caddy_data:
